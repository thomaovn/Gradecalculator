<!DOCTYPE html>
<html lang="en">
<head>
  <title> Grade Calculator </title>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #1a1a1a;
    color: #e8e8e8;
    font-family: system-ui, sans-serif;
    min-height: 100vh;
    padding: 2rem 1.5rem;
    max-width: 640px;
    margin: 0;
  }
  h1 { font-size: 20px; font-weight: 500; margin-bottom: 0.25rem; }
  .sub { font-size: 17px; color: #888; margin-bottom: 1.75rem; }

  .weights-section { margin-bottom: 1.5rem; }
  .weights-row { display: flex; gap: 12px; align-items: flex-end; margin-bottom: 8px; }
  .weight-block { flex: 1; }
  .weight-label { font-size: 15px; color: #888; margin-bottom: 6px; }
  .weight-input-row { display: flex; align-items: center; gap: 8px; }
  .weight-input-row input[type=range] { flex: 1; accent-color: #7c6ef7; }

  .weight-num {
    width: 58px;
    background: #2a2a2a;
    border: 0.5px solid #444;
    border-radius: 8px;
    color: #e8e8e8;
    font-size: 15px;
    font-weight: 500;
    padding: 4px 8px;
    text-align: center;
    -moz-appearance: textfield;
  }
  .weight-num::-webkit-inner-spin-button,
  .weight-num::-webkit-outer-spin-button { -webkit-appearance: none; }
  .weight-num:focus { outline: none; border-color: #7c6ef7; }
  .weight-pct { font-size: 15px; color: #888; margin-left: 3px; }


  .sliders { display: grid; gap: 12px; margin-bottom: 1.5rem; }
  .slider-row { display: flex; align-items: center; gap: 12px; }
  .slider-label { font-size: 14px; color: #aaa; width: 150px; flex-shrink: 0; }
  .slider-row input[type=range] { flex: 1; accent-color: #7c6ef7; }
  .grade-num {
    width: 48px;
    background: #2a2a2a;
    border: 0.5px solid #444;
    border-radius: 8px;
    color: #e8e8e8;
    font-size: 14px;
    font-weight: 500;
    padding: 4px 8px;
    text-align: center;
    -moz-appearance: textfield;
  }
  .grade-num::-webkit-inner-spin-button,
  .grade-num::-webkit-outer-spin-button { -webkit-appearance: none; }
  .grade-num:focus { outline: none; border-color: #7c6ef7; }
  .grade-letter { font-size: 14px; color: #888; margin-left: 3px; }

  .result-box {
    background: #262626;
    border: 0.5px solid #333;
    border-radius: 14px;
    padding: 1.25rem 1.5rem;
    margin-bottom: 1.5rem;
    display: flex;
    align-items: center;
    gap: 1.5rem;
  }
  .result-grade { font-size: 52px; font-weight: 500; min-width: 60px; }
  .result-info { flex: 1; }
  .result-score { font-size: 13px; color: #888; }
  .result-desc { font-size: 15px; color: #e8e8e8; margin-top: 3px; }

  .g-col-A { color: #7ed96a; }
  .g-col-B { color: #5dbfb0; }
  .g-col-C { color: #7c9ef7; }
  .g-col-D { color: #e2b84a; }
  .g-col-E { color: #e2813a; }
  .g-col-F { color: #e2504a; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { font-size: 11px; font-weight: 500; color: #666; text-align: center; padding: 8px 4px; border-bottom: 0.5px solid #2e2e2e; }
  th:first-child { text-align: left; }
  td { padding: 7px 4px; text-align: center; border-bottom: 0.5px solid #222; }
  td:first-child { text-align: left; color: #888; font-size: 12px; }
  .badge {
    display: inline-block;
    border-radius: 6px;
    padding: 2px 10px;
    font-weight: 500;
    font-size: 12px;
  }
  .b-A { background: #1e3a18; color: #7ed96a; }
  .b-B { background: #0e332f; color: #5dbfb0; }
  .b-C { background: #152040; color: #7c9ef7; }
  .b-D { background: #3a2c0e; color: #e2b84a; }
  .b-E { background: #3a1e0e; color: #e2813a; }
  .b-F { background: #3a1010; color: #e2504a; }
  .active-cell { background: #2a2440; border-radius: 6px; }

  input[type=range] {
    height: 4px;
    border-radius: 2px;
    cursor: pointer;
  }

  .add-btn {
    background: #7c6ef7;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 8px 16px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
  }
  .add-btn:hover { background: #6a5de0; }

  .summary-section {
    margin-top: 1.5rem;
  }
  .summary-title {
    font-size: 13px;
    font-weight: 500;
    color: #666;
    margin-bottom: 8px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .summary-list { display: grid; gap: 6px; margin-bottom: 10px; }
  .summary-entry {
    display: flex;
    align-items: center;
    gap: 10px;
    background: #222;
    border: 0.5px solid #2e2e2e;
    border-radius: 8px;
    padding: 7px 12px;
    font-size: 13px;
  }
  .summary-entry-grade { font-weight: 600; min-width: 20px; }
  .summary-entry-detail { flex: 1; color: #888; }
  .summary-remove {
    background: none;
    border: none;
    color: #555;
    cursor: pointer;
    font-size: 15px;
    line-height: 1;
    padding: 0 2px;
  }
  .summary-remove:hover { color: #e2504a; }
  .summary-edit {
    background: none;
    border: none;
    color: #555;
    cursor: pointer;
    font-size: 13px;
    line-height: 1;
    padding: 0 2px;
  }
  .summary-edit:hover { color: #7c6ef7; }
  .entry-edit-form {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    align-items: center;
    width: 100%;
  }
  .entry-edit-form input[type=text] {
    background: #2a2a2a;
    border: 0.5px solid #7c6ef7;
    border-radius: 6px;
    color: #e8e8e8;
    font-size: 13px;
    padding: 3px 8px;
    flex: 1;
    min-width: 100px;
  }
  .entry-edit-form input[type=text]:focus { outline: none; }
  .entry-edit-select, .entry-edit-pct {
    background: #2a2a2a;
    border: 0.5px solid #444;
    border-radius: 6px;
    color: #e8e8e8;
    font-size: 13px;
    padding: 3px 8px;
    cursor: pointer;
  }
  .entry-edit-pct { width: 64px; -moz-appearance: textfield; }
  .entry-edit-pct::-webkit-inner-spin-button,
  .entry-edit-pct::-webkit-outer-spin-button { -webkit-appearance: none; }
  .entry-edit-select:focus, .entry-edit-pct:focus { outline: none; border-color: #7c6ef7; }
  .entry-save-btn {
    background: #7c6ef7;
    border: none;
    border-radius: 6px;
    color: #fff;
    font-size: 12px;
    padding: 3px 10px;
    cursor: pointer;
  }
  .entry-save-btn:hover { background: #6a5de0; }
  .entry-cancel-btn {
    background: none;
    border: 0.5px solid #444;
    border-radius: 6px;
    color: #888;
    font-size: 12px;
    padding: 3px 10px;
    cursor: pointer;
  }
  .entry-cancel-btn:hover { border-color: #888; color: #e8e8e8; }
  .summary-avg-box {
    background: #262626;
    border: 0.5px solid #333;
    border-radius: 10px;
    padding: 10px 14px;
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 14px;
  }
  .summary-avg-grade { font-size: 52px; font-weight: 500; min-width: 60px; }
  .summary-avg-label { color: #888; font-size: 13px; }
  .summary-manual-add {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-top: 10px;
    flex-wrap: wrap;
  }
  .summary-manual-add input {
    background: #2a2a2a;
    border: 0.5px solid #444;
    border-radius: 8px;
    color: #e8e8e8;
    font-size: 13px;
    padding: 6px 10px;
    flex: 1;
    min-width: 120px;
  }
  .summary-manual-add input::placeholder { color: #555; }
  .summary-manual-add input:focus { outline: none; border-color: #7c6ef7; }
  .summary-manual-add select {
    background: #2a2a2a;
    border: 0.5px solid #444;
    border-radius: 8px;
    color: #e8e8e8;
    font-size: 13px;
    padding: 6px 10px;
    cursor: pointer;
  }
  .summary-manual-add select:focus { outline: none; border-color: #7c6ef7; }
  .summary-manual-btn {
    background: #2a2a2a;
    border: 0.5px solid #444;
    border-radius: 8px;
    color: #e8e8e8;
    font-size: 13px;
    padding: 6px 14px;
    cursor: pointer;
    white-space: nowrap;
  }
  .summary-manual-btn:hover { border-color: #7c6ef7; color: #7c6ef7; }

  .course-input {
    background: #2a2a2a;
    border: 0.5px solid #444;
    border-radius: 8px;
    color: #e8e8e8;
    font-size: 14px;
    padding: 6px 12px;
    width: 100%;
    max-width: 320px;
    margin-bottom: 1.75rem;
    display: block;
  }
  .course-input::placeholder { color: #555; }
  .course-input:focus { outline: none; border-color: #7c6ef7; }
</style>
</head>
<body>
<h1>Grade Calculator</h1>
<p class="sub">Set weights and grades to see the final result</p>
<input type="text" class="course-input" id="course-name" placeholder="Course name (optional)" maxlength="60" aria-label="Course name">

<div class="weights-section">
  <div class="weights-row">
    <div class="weight-block">
      <label class="weight-label" for="examPct">Exam (%)</label>
      <div class="weight-input-row">
        <input type="range" min="0" max="100" step="5" value="50" id="examPct" oninput="onExamPct()">
        <input type="number" class="weight-num" min="0" max="100" value="50" id="examPct-num" aria-label="Exam weight percentage" oninput="onExamPctNum()"><span class="weight-pct">%</span>
      </div>
    </div>
    <div class="weight-block">
      <label class="weight-label" for="mapPct">Portfolio (%)</label>
      <div class="weight-input-row">
        <input type="range" min="0" max="100" step="5" value="50" id="mapPct" oninput="onMapPct()">
        <input type="number" class="weight-num" min="0" max="100" value="50" id="mapPct-num" aria-label="Portfolio weight percentage" oninput="onMapPctNum()"><span class="weight-pct">%</span>
      </div>
    </div>
  </div>
</div>

<div class="sliders">
  <div class="slider-row">
    <label class="slider-label" for="exam">Written exam</label>
    <input type="range" min="1" max="6" step="1" value="4" id="exam" oninput="onExamSlider()">
    <input type="number" class="grade-num" min="1" max="6" value="4" id="exam-num" aria-label="Written exam grade" oninput="onExamNum()">
    <span class="grade-letter" id="exam-letter">(C)</span>
  </div>
  <div class="slider-row">
    <label class="slider-label" for="folder">Portfolio</label>
    <input type="range" min="1" max="6" step="1" value="4" id="folder" oninput="onFolderSlider()">
    <input type="number" class="grade-num" min="1" max="6" value="4" id="folder-num" aria-label="Portfolio grade" oninput="onFolderNum()">
    <span class="grade-letter" id="folder-letter">(C)</span>
  </div>
</div>

<div class="result-box">
  <div class="result-grade g-col-C" id="result-grade">C</div>
  <div class="result-info">
    <div class="result-score" id="result-score">Weighted score: 4.0 · exam 60% · portfolio 40%</div>
    <div class="result-desc" id="result-desc">Good performance</div>
  </div>
  <button class="add-btn" onclick="addToSummary()">+ Add</button>
</div>

<table>
  <thead>
    <tr>
      <th>Portfolio ↓ / Exam →</th>
      <th>A (6)</th><th>B (5)</th><th>C (4)</th><th>D (3)</th><th>E (2)</th><th>F (1)</th>
    </tr>
  </thead>
  <tbody id="table-body"></tbody>
</table>
<h1 style="margin-top:2rem">Average Grade Calculator</h1>
<div class="summary-section" id="summary-section">

  <div class="summary-title">Summary</div>
  <div class="summary-list" id="summary-list"></div>
  <div class="summary-avg-box">
    <div class="summary-avg-grade" id="summary-avg-grade"></div>
    <div>
      <div class="summary-avg-label" id="summary-avg-label"></div>
      <div style="font-size:12px;color:#555" id="summary-avg-count"></div>
    </div>
  </div>
  <div class="summary-manual-add">
    <input type="text" id="manual-course-name" placeholder="Course name (optional)" maxlength="60" aria-label="Manual course name">
    <select id="manual-grade" aria-label="Manual grade">
      <option value="6">A (6)</option>
      <option value="5">B (5)</option>
      <option value="4" selected>C (4)</option>
      <option value="3">D (3)</option>
      <option value="2">E (2)</option>
      <option value="1">F (1)</option>
    </select>
    <button class="summary-manual-btn" onclick="addManualGrade()">+ Add manually</button>
  </div>
</div>

<script>
const grades = [6,5,4,3,2,1];
const letters = {6:'A',5:'B',4:'C',3:'D',2:'E',1:'F'};
const desc = {6:'Excellent performance',5:'Very good performance',4:'Good performance',3:'Satisfactory performance',2:'Sufficient performance',1:'Fail'};
const gradeColors = {A:'g-col-A',B:'g-col-B',C:'g-col-C',D:'g-col-D',E:'g-col-E',F:'g-col-F'};

let examW = 0.5, mapW = 0.5;

function setWeights(examVal) {
  examVal = Math.min(100, Math.max(0, examVal));
  const mapVal = 100 - examVal;
  document.getElementById('examPct').value = examVal;
  document.getElementById('examPct-num').value = examVal;
  document.getElementById('mapPct').value = mapVal;
  document.getElementById('mapPct-num').value = mapVal;
  examW = examVal / 100;
  mapW = mapVal / 100;
  update();
}

function onExamPct() { setWeights(parseInt(document.getElementById('examPct').value)); }
function onMapPct()  { setWeights(100 - parseInt(document.getElementById('mapPct').value)); }
function onExamPctNum() {
  const v = parseInt(document.getElementById('examPct-num').value);
  if (!isNaN(v)) setWeights(v);
}
function onMapPctNum() {
  const v = parseInt(document.getElementById('mapPct-num').value);
  if (!isNaN(v)) setWeights(100 - v);
}

function calc(e, m) { return Math.min(6, Math.max(1, Math.round(e * examW + m * mapW))); }

function setGrade(id, val) {
  val = Math.min(6, Math.max(1, val));
  document.getElementById(id).value = val;
  document.getElementById(id + '-num').value = val;
  document.getElementById(id + '-letter').textContent = '(' + letters[val] + ')';
}

function onExamSlider() { setGrade('exam', parseInt(document.getElementById('exam').value)); update(); }
function onFolderSlider() { setGrade('folder', parseInt(document.getElementById('folder').value)); update(); }
function onExamNum() { const v = parseInt(document.getElementById('exam-num').value); if (!isNaN(v)) { setGrade('exam', v); update(); } }
function onFolderNum() { const v = parseInt(document.getElementById('folder-num').value); if (!isNaN(v)) { setGrade('folder', v); update(); } }

function update() {
  const e = parseInt(document.getElementById('exam').value);
  const m = parseInt(document.getElementById('folder').value);
  if (isNaN(e) || isNaN(m)) return;
  document.getElementById('exam-letter').textContent = '(' + letters[e] + ')';
  document.getElementById('folder-letter').textContent = '(' + letters[m] + ')';
  const score = (e * examW + m * mapW).toFixed(2);
  const final = calc(e, m);
  const gl = letters[final];
  const gradeEl = document.getElementById('result-grade');
  gradeEl.textContent = gl;
  gradeEl.className = 'result-grade ' + gradeColors[gl];
  document.getElementById('result-score').textContent =
    'Weighted score: ' + score + ' · exam ' + Math.round(examW*100) + '% · portfolio ' + Math.round(mapW*100) + '%';
  document.getElementById('result-desc').textContent = desc[final];
  buildTable(e, m);
}

function buildTable(selE, selM) {
  const tbody = document.getElementById('table-body');
  tbody.innerHTML = '';
  grades.forEach(m => {
    const tr = document.createElement('tr');
    let html = '<td>Portfolio ' + letters[m] + ' (' + m + ')</td>';
    grades.forEach(e => {
      const g = calc(e, m);
      const gl = letters[g];
      const active = e === selE && m === selM;
      html += '<td><span class="badge b-' + gl + (active ? ' active-cell' : '') + '">' + gl + '</span></td>';
    });
    tr.innerHTML = html;
    tbody.appendChild(tr);
  });
}

const savedGrades = [];

function escapeHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function addToSummary() {
  const e = parseInt(document.getElementById('exam').value);
  const m = parseInt(document.getElementById('folder').value);
  const score = parseFloat((e * examW + m * mapW).toFixed(2));
  const final = calc(e, m);
  const rawName = document.getElementById('course-name').value.trim().slice(0, 60);
  savedGrades.push({
    letter: letters[final],
    value: final,
    score,
    examPct: Math.round(examW * 100),
    mapPct: Math.round(mapW * 100),
    name: rawName
  });
  renderSummary();
}

function addManualGrade() {
  const rawName = document.getElementById('manual-course-name').value.trim().slice(0, 60);
  const value = parseInt(document.getElementById('manual-grade').value);
  savedGrades.push({ letter: letters[value], value, score: value, name: rawName, manual: true });
  document.getElementById('manual-course-name').value = '';
  renderSummary();
}

function editSummaryEntry(i) {
  const entry = document.getElementById('summary-entry-' + i);
  const g = savedGrades[i];
  const gradeOptions = [6,5,4,3,2,1].map(v =>
    `<option value="${v}"${g.value === v ? ' selected' : ''}>${letters[v]} (${v})</option>`
  ).join('');
  const pctFields = !g.manual
    ? `<input type="number" class="entry-edit-pct" id="edit-exam-${i}" value="${g.examPct}" min="0" max="100" aria-label="Exam percentage" oninput="this.value=Math.min(100,Math.max(0,parseInt(this.value)||0))"><span style="color:#888;font-size:12px">exam %</span>`
    : '';
  entry.innerHTML = `
    <div class="entry-edit-form">
      <input type="text" id="edit-name-${i}" value="${escapeHtml(g.name || '')}" placeholder="Course name" maxlength="60" aria-label="Course name">
      <select class="entry-edit-select" id="edit-grade-${i}" aria-label="Grade">${gradeOptions}</select>
      ${pctFields}
      <button class="entry-save-btn" onclick="saveEntryEdit(${i})">Save</button>
      <button class="entry-cancel-btn" onclick="renderSummary()">Cancel</button>
    </div>`;
  const editForm = entry.querySelector('.entry-edit-form');
  editForm.addEventListener('keydown', e => { if (e.key === 'Enter') saveEntryEdit(i); if (e.key === 'Escape') renderSummary(); });
  document.getElementById('edit-name-' + i).focus();
}

function saveEntryEdit(i) {
  const g = savedGrades[i];
  g.name = document.getElementById('edit-name-' + i).value.trim().slice(0, 60);
  const newValue = parseInt(document.getElementById('edit-grade-' + i).value);
  g.value = newValue;
  g.letter = letters[newValue];
  g.score = newValue;
  if (!g.manual) {
    const examPct = Math.min(100, Math.max(0, parseInt(document.getElementById('edit-exam-' + i).value) || 0));
    g.examPct = examPct;
    g.mapPct = 100 - examPct;
  }
  renderSummary();
}

function removeFromSummary(i) {
  savedGrades.splice(i, 1);
  renderSummary();
}

function renderSummary() {
  const section = document.getElementById('summary-section');
  const list = document.getElementById('summary-list');
  section.style.display = '';
  list.innerHTML = savedGrades.map((g, i) =>
    `<div class="summary-entry" id="summary-entry-${i}">
      <span class="summary-entry-grade ${gradeColors[g.letter]}">${g.letter}</span>
      <span class="summary-entry-detail">
        ${g.name ? '<strong>' + escapeHtml(g.name) + '</strong> &middot; ' : ''}${'Score ' + g.letter + ' (' + g.score + ')' + (g.manual ? '' : ' &middot; exam ' + g.examPct + '% / portfolio ' + g.mapPct + '%')}
      </span>
      <button class="summary-edit" onclick="editSummaryEntry(${i})" title="Edit">✎</button>
      <button class="summary-remove" onclick="removeFromSummary(${i})" title="Remove">&times;</button>
    </div>`
  ).join('');
  if (savedGrades.length === 0) {
    document.getElementById('summary-avg-grade').textContent = '';
    document.getElementById('summary-avg-label').textContent = '';
    document.getElementById('summary-avg-count').textContent = '';
    return;
  }
  const avg = savedGrades.reduce((s, g) => s + g.value, 0) / savedGrades.length;
  const avgFinal = Math.min(6, Math.max(1, Math.round(avg)));
  const avgLetter = letters[avgFinal];
  const avgGradeEl = document.getElementById('summary-avg-grade');
  avgGradeEl.textContent = avgLetter;
  avgGradeEl.className = 'summary-avg-grade ' + gradeColors[avgLetter];
  document.getElementById('summary-avg-label').textContent = 'Average: ' + avg.toFixed(2) + ' → ' + desc[avgFinal];
  document.getElementById('summary-avg-count').textContent = savedGrades.length + ' grade' + (savedGrades.length !== 1 ? 's' : '');
}

document.querySelectorAll('.grade-num').forEach(el => {
  el.addEventListener('input', function() {
    this.value = this.value.replace(/\D/g, '');
    if (this.value.length > 1) this.value = this.value.slice(0, 1);
  });
});
document.querySelectorAll('.weight-num').forEach(el => {
  el.addEventListener('input', function() {
    this.value = this.value.replace(/\D/g, '');
    if (this.value.length > 3) this.value = this.value.slice(0, 3);
  });
});

update();
</script>
</body>
</html>
